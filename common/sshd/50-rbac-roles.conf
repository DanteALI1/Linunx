# Drop-in: /etc/ssh/sshd_config.d/50-rbac-roles.conf
# svcsec: только internal-sftp в chroot /opt/install
# svcsecadmin: полный DenyUsers (нет SSH)

# Глобально запретить svcsecadmin по SSH
DenyUsers svcsecadmin

# svcsec — SFTP only, chroot
Match User svcsec
    ForceCommand internal-sftp -d /staging
    ChrootDirectory /opt/install
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    AllowAgentForwarding no
    PasswordAuthentication no
    PubkeyAuthentication yes
    PermitTTY no
    # Запрет перезаписи/удаления на уровне SFTP обеспечивается:
    # - sticky bit / ACL на staging
    # - опционально: Chroot + read-only bind mount approved вне writable
    # OpenSSH internal-sftp не имеет флага "no overwrite"; контроль — права + audit

# Запрет SSH для poinstall/editor по умолчанию можно включить политикой:
# DenyUsers poinstaller editor1
# Или оставить SSH с ключами, полагаясь на sudoers/MAC.
